<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexFit AI | Personal Workout & Fitness Coach</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

<style>
  :root {
    --bg-dark: #090d16;
    --bg-surface: #0f172a;
    --bg-card: rgba(30, 41, 59, 0.75);
    --border-color: rgba(255, 255, 255, 0.1);
    --border-glow: rgba(99, 102, 241, 0.3);
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    --accent-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    --accent-color: #6366f1;
    --accent-light: #818cf8;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --user-bubble-bg: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    --agent-bubble-bg: rgba(30, 41, 59, 0.85);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 70%);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header Branding */
  header {
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
    color: #ffffff;
  }
  .brand-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 400;
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.25);
    color: #10b981;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
  }

  /* Chat Dialogue Body */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* Welcome Banner */
  .welcome-card {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 1.25rem;
    text-align: center;
    margin-bottom: 0.5rem;
    backdrop-filter: blur(8px);
  }
  .welcome-card h3 {
    margin: 0 0 0.4rem 0;
    font-size: 1.1rem;
    color: var(--accent-light);
  }
  .welcome-card p {
    margin: 0;
    font-size: 0.88rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* Dialogue Message Rows */
  .msg-row {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeInUp 0.3s ease forwards;
  }
  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .msg-row.user .avatar {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
  }
  .msg-row.agent .avatar {
    background: var(--accent-gradient);
    box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
  }

  .msg-content {
    max-width: 85%;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .msg-row.user .msg-content {
    align-items: flex-end;
  }

  .sender-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    padding: 0 0.2rem;
  }

  .bubble {
    padding: 0.75rem 1.1rem;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .msg-row.user .bubble {
    background: var(--user-bubble-bg);
    color: #ffffff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
  }

  .msg-row.agent .bubble {
    background: var(--agent-bubble-bg);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-bottom-left-radius: 4px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(10px);
  }

  /* Standalone A2UI Card Container */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Prompts Bar Above Input */
  .footer-container {
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-color);
    padding: 0.8rem 1.5rem 1.2rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
  }

  .prompts-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    overflow-x: auto;
    padding-bottom: 0.25rem;
    scrollbar-width: none;
  }
  .prompts-bar::-webkit-scrollbar { display: none; }

  .prompt-chip {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 0.45rem 0.85rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .prompt-chip:hover {
    background: rgba(99, 102, 241, 0.2);
    border-color: var(--accent-light);
    transform: translateY(-1px);
    box-shadow: 0 2px 10px rgba(99, 102, 241, 0.2);
  }
  .chip-icon { font-size: 0.95rem; }

  /* Input Form */
  form {
    display: flex;
    gap: 0.6rem;
    align-items: center;
  }

  .input-wrapper {
    position: relative;
    flex: 1;
  }

  input {
    width: 100%;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 0.85rem 1.1rem;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
  }
  input::placeholder { color: var(--text-muted); }
  input:focus {
    border-color: var(--accent-color);
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
    background: rgba(15, 23, 42, 0.95);
  }

  button.send-btn {
    padding: 0.85rem 1.3rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  button.send-btn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
  }

  /* --- A2UI Component Render Styling --- */
  .a2card {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid var(--border-color);
    border-left: 3px solid var(--accent-color);
    border-radius: 14px;
    padding: 1.1rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    max-width: 100%;
    backdrop-filter: blur(12px);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-main); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #ffffff; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--accent-light); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #ffffff; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); }
  .a2text.a2-caption { font-size: 0.82rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border-color); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; border: 1px solid var(--border-color); margin-top: 0.5rem; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent-light); }

  /* Animated Typing Dots */
  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.2rem 0.4rem;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-light);
    animation: blink 1.4s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes blink {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <div>
      <div class="brand-title">ApexFit AI</div>
      <div class="brand-subtitle">Personal Workout & Fitness Coach</div>
    </div>
  </div>
  <div class="status-pill">
    <span class="status-dot"></span>
    Active Coach
  </div>
</header>

<div id="log">
  <div class="welcome-card">
    <h3>👋 Welcome to ApexFit AI!</h3>
    <p>Ask for customized workout plans, exercise movement cues, 1-Rep Max calculations, or explore our dynamic exercise library.</p>
  </div>
</div>

<div class="footer-container">
  <!-- Clickable 3 Example Prompt Chips -->
  <div class="prompts-bar">
    <button type="button" class="prompt-chip" onclick="sendPrompt('Suggest a 3-exercise chest routine')">
      <span class="chip-icon">🏋️</span>
      <span class="chip-text">3-Exercise Chest Workout</span>
    </button>
    <button type="button" class="prompt-chip" onclick="sendPrompt('Show movement guide for Romanian Deadlifts')">
      <span class="chip-icon">📌</span>
      <span class="chip-text">Romanian Deadlift Guide</span>
    </button>
    <button type="button" class="prompt-chip" onclick="sendPrompt('Compute my 1-rep max for 200 lbs x 5 reps')">
      <span class="chip-icon">⚡</span>
      <span class="chip-text">1RM Calc (200 lbs × 5)</span>
    </button>
  </div>

  <form id="form">
    <div class="input-wrapper">
      <input id="input" placeholder="Ask ApexFit AI about workouts, form guides, or metrics..." autocomplete="off" autofocus>
    </div>
    <button class="send-btn" type="submit">
      <span>Send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "⚡");
  const content = el("div", "msg-content");
  const sender = el("div", "sender-label", who === "user" ? "You" : "ApexFit AI");
  const b = el("div", "bubble");

  content.appendChild(sender);
  content.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(content);

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) {
    for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  }
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) {
      const spec = comps[id];
      childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c));
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) {
    const node = buildNode(rid, comps, new Set());
    if (node) { container.appendChild(node); drew = true; }
  }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) {
        if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
      }
    }
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  
  const b = bubble("agent");
  b.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
